name: sales_tracker
description: "Al Tuwijri Wallet — track your sales transactions and loyalty points."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0        # QR code with logo embedded in the middle
  barcode_widget: ^2.0.4    # Code128 receipt barcode (cashier scans for refunds)
  lottie: ^3.1.3            # Lottie animations (login screen)
  google_fonts: ^6.2.1     # Tajawal (Arabic + Latin) typography
  intl: ^0.20.2             # date & currency formatting
  hijri: ^3.0.0             # Hijri (Islamic) calendar dates
  http: ^1.2.2              # for the real API later (mock service ready to swap)
  flutter_secure_storage: ^9.2.2  # encrypted store for remembered credentials
  local_auth: ^2.3.0        # fingerprint / face biometric login (device only)
  shared_preferences: ^2.3.2      # small non-secret flags (remember-me, biometric-on)
  video_player: ^2.9.2      # splash background video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4   # generates launcher icons from the brand logo

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#7B1E2B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    background_color: "#7B1E2B"
    theme_color: "#7B1E2B"
  windows:
    generate: true
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/video/
