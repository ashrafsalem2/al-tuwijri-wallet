# Codemagic CI/CD for Al Tuwijri Wallet
# ---------------------------------------------------------------------------
# Lets you build the iOS app in the cloud on a real macOS machine WITHOUT
# owning a Mac. Sign up at https://codemagic.io, connect this repo, and run a
# workflow. (Flutter code needs no changes — the ios/ folder is already here.)
# ---------------------------------------------------------------------------

workflows:
  # ---------------------------------------------------------------------
  # 1) iOS — unsigned build. No Apple account needed. Proves the iOS app
  #    compiles on macOS and produces a Runner.app you can download.
  # ---------------------------------------------------------------------
  ios-unsigned:
    name: iOS build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  # ---------------------------------------------------------------------
  # 2) iOS — signed .ipa + TestFlight upload.
  #    Requires an Apple Developer account ($99/yr). In Codemagic:
  #      - add an App Store Connect API key integration (name it below),
  #      - set the bundle id to your real id (see project settings),
  #      - uncomment this workflow.
  # ---------------------------------------------------------------------
  # ios-release:
  #   name: iOS release (TestFlight)
  #   instance_type: mac_mini_m2
  #   max_build_duration: 90
  #   integrations:
  #     app_store_connect: CodemagicAppStoreKey   # <- your ASC API key integration name
  #   environment:
  #     flutter: stable
  #     xcode: latest
  #     cocoapods: default
  #     ios_signing:
  #       distribution_type: app_store
  #       bundle_identifier: com.yourcompany.altuwijriwallet   # <- your real bundle id
  #   scripts:
  #     - name: Flutter packages
  #       script: flutter pub get
  #     - name: Set up code signing
  #       script: xcode-project use-profiles
  #     - name: Build signed IPA
  #       script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
  #   artifacts:
  #     - build/ios/ipa/*.ipa
  #   publishing:
  #     app_store_connect:
  #       auth: integration
  #       submit_to_testflight: true

  # ---------------------------------------------------------------------
  # 3) Android — release APK (bonus; Codemagic can build this too).
  # ---------------------------------------------------------------------
  android-apk:
    name: Android APK (release)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
